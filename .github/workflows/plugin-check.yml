name: WordPress Plugin Check

on:
  push:
    branches: [main]
    paths:
      - 'dendrila-accessibility-assistant.php'
      - 'includes/**'
      - 'assets/**'
      - 'readme.txt'
      - '.github/workflows/plugin-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dendrila-accessibility-assistant.php'
      - 'includes/**'
      - 'assets/**'
      - 'readme.txt'
      - '.github/workflows/plugin-check.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dendrila-accessibility-wpcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: WordPress plugin metadata
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify version, tags and readme
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*\* Version:[[:space:]]*//p' dendrila-accessibility-assistant.php | head -n1)
          RUNTIME=$(sed -n "s/^define('DAA_VERSION', '\([^']*\)');/\1/p" dendrila-accessibility-assistant.php | head -n1)
          TAGS=$(grep '^Tags:' readme.txt | cut -d: -f2- | tr ',' '\n' | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          SIZE=$(wc -c < readme.txt | tr -d ' ')
          test -n "$VERSION"
          test "$VERSION" = "$RUNTIME"
          test "$TAGS" -le 5
          test "$SIZE" -le 10240
          echo "Version: $VERSION · tags: $TAGS · readme: $SIZE bytes"

  official:
    name: Official WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: wordpress/plugin-check-action@v1.1.9
        with:
          wp-version: latest
          slug: dendrila-accessibility-assistant
          exclude-directories: '.github,docs,tests,dist,build'
          exclude-files: '.gitignore,README.md,SECURITY.md,CONTRIBUTING.md,AGENTS.md'
